<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop — Cupim</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    .shop-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 72px);
    }
    .shop-sidebar {
      border-right: 1px solid var(--border);
      padding: 40px 32px;
      position: sticky; top: 72px;
      height: calc(100vh - 72px);
      overflow-y: auto;
    }
    .filter-title {
      font-size: 10px; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gray); margin-bottom: 20px;
    }
    .filter-group { margin-bottom: 32px; }
    .filter-label {
      font-family: var(--serif);
      font-size: 16px; font-weight: 500;
      margin-bottom: 12px; display: block;
    }
    .filter-option {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; cursor: pointer;
      font-size: 13px; color: var(--gray);
      transition: color 0.2s;
    }
    .filter-option:hover { color: var(--black); }
    .filter-option input { accent-color: var(--red); }
    .filter-option.active { color: var(--black); font-weight: 400; }
    .price-range { display: flex; gap: 8px; align-items: center; }
    .price-input {
      width: 80px; border: 1px solid var(--border);
      padding: 8px 10px; font-size: 13px;
      outline: none;
    }
    .price-input:focus { border-color: var(--black); }

    .shop-content { padding: 40px 48px; }
    .shop-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .shop-count { font-size: 13px; color: var(--gray); }
    .sort-select {
      border: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 12px;
      font-family: var(--sans);
      outline: none;
      background: var(--white);
    }
    .empty-shop {
      text-align: center; padding: 120px 0;
      color: var(--gray);
    }
    .empty-shop i { font-size: 48px; display: block; margin-bottom: 20px; opacity: 0.4; }
    .empty-shop h3 { font-family: var(--serif); font-size: 24px; margin-bottom: 8px; color: var(--black); }

    @media(max-width:768px) {
      .shop-layout { grid-template-columns: 1fr; }
      .shop-sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 24px 20px; }
      .shop-content { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">Cupim<span>.</span></a>
  <a href="shop.html" class="nav-link active">Shop</a>
  <a href="shop.html" class="nav-link">Collections</a>
  <a href="#" class="nav-link">À propos</a>
  <div class="nav-icons">
    <button class="nav-icon-btn" onclick="location.href='cart.html'" aria-label="Cart">
      <i class="ti ti-shopping-bag" aria-hidden="true"></i>
      <span class="cart-count" id="cart-count" style="display:none">0</span>
    </button>
    
  </div>
</nav>

<div class="page-header">
  <h1>La Boutique</h1>
  <p>Accessoires de luxe · Luxury Accessories</p>
</div>

<div class="shop-layout">
  <!-- Sidebar -->
  <aside class="shop-sidebar">
    <div class="filter-title">Filtres</div>

    <div class="filter-group">
      <span class="filter-label">Catégorie</span>
      <div id="category-filters">
        <label class="filter-option">
          <input type="radio" name="cat" value="" checked> Tous / All
        </label>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Prix (DA)</span>
      <div class="price-range">
        <input type="number" class="price-input" id="min-price" placeholder="Min"/>
        <span style="color:var(--gray)">—</span>
        <input type="number" class="price-input" id="max-price" placeholder="Max"/>
      </div>
      <button class="btn-outline" style="margin-top:12px;padding:8px 16px;font-size:10px" onclick="applyFilters()">Appliquer</button>
    </div>
  </aside>

  <!-- Products -->
  <div class="shop-content">
    <div class="shop-header">
      <span class="shop-count" id="shop-count">Chargement…</span>
      <select class="sort-select" id="sort-select" onchange="applyFilters()">
        <option value="newest">Plus récents</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
      </select>
    </div>
    <div class="product-grid" id="products-grid">
      <div style="grid-column:1/-1;text-align:center;padding:80px 0;color:var(--gray)">
        <i class="ti ti-loader" style="font-size:32px;display:block;margin-bottom:16px"></i>
        Chargement…
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-bottom" style="border-top:none;padding-top:0">
    <span>© 2026 Cupim. Tous droits réservés.</span>
    <a href="index.html" style="color:#666">← Retour à l'accueil</a>
  </div>
</footer>

<div class="toast" id="global-toast"></div>
<script src="js/app.js"></script>
<script>
  let allProducts = [];
  let categories = [];

  
  async function loadCategories() {
    try {
      categories = await request('GET', '/categories');
      const container = document.getElementById('category-filters');
      container.innerHTML = `<label class="filter-option"><input type="radio" name="cat" value="" checked> Tous / All</label>`;
      categories.forEach(c => {
        container.innerHTML += `<label class="filter-option"><input type="radio" name="cat" value="${c.id}"> ${c.name}</label>`;
      });
      container.querySelectorAll('input').forEach(i => i.addEventListener('change', applyFilters));
    } catch(e) {}
  }

  async function loadProducts() {
    try {
      allProducts = await request('GET', '/products?limit=100');
      applyFilters();
    } catch(e) {
      document.getElementById('products-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:80px 0;color:var(--gray)">
          Impossible de charger les produits. Vérifiez que le serveur est démarré.
        </div>`;
      document.getElementById('shop-count').textContent = '';
    }
  }

  function applyFilters() {
    const catVal = document.querySelector('input[name="cat"]:checked')?.value || '';
    const minP = parseFloat(document.getElementById('min-price').value) || 0;
    const maxP = parseFloat(document.getElementById('max-price').value) || Infinity;
    const sort = document.getElementById('sort-select').value;

    let filtered = allProducts.filter(p => {
      if (catVal && p.category_id != catVal) return false;
      if (p.price < minP || p.price > maxP) return false;
      return true;
    });

    if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

    renderProducts(filtered);
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    document.getElementById('shop-count').textContent = `${products.length} produit${products.length !== 1 ? 's' : ''}`;

    if (!products.length) {
      grid.innerHTML = `
        <div class="empty-shop" style="grid-column:1/-1">
          <i class="ti ti-package-off"></i>
          <h3>Aucun produit trouvé</h3>
          <p>Essayez d'autres filtres · Try different filters</p>
        </div>`;
      return;
    }

    grid.innerHTML = products.map(p => `
      <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
        <div class="product-card-img">
          ${p.images && p.images.length ? `<img src="${p.images[0]}" alt="${p.title}"/>` : productPlaceholder()}
        </div>
        <div class="product-card-cat">${p.category_name || 'Accessoire'}</div>
        <div class="product-card-name">${p.title}</div>
        <div class="product-card-price">${formatPrice(p.price)}</div>
      </div>
    `).join('');
  }

  loadCategories();
  loadProducts();
</script>
</body>
</html>
